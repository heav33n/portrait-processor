name: Release

# Push a tag like v0.2.0 to build all three packages and publish a GitHub release.
# Run it by hand from the Actions tab to build and test the packages without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.1"

jobs:
  models:
    name: Pack bundled models
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Restore packed models
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/models
          key: models-${{ hashFiles('python/portrait_processor/levels.py', 'python/portrait_processor/models.py', 'tools/pack_models.py', 'uv.lock') }}
      - name: Download and pack models
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          uv sync --locked --no-install-project
          levels=$(uv run --no-sync python -c "import sys; sys.path.insert(0, 'python'); from portrait_processor.levels import LEVELS; print(','.join(str(l.number) for l in LEVELS if l.bundled))")
          uv run --no-sync python tools/pack_models.py --skip-timing --levels "$levels"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: models
          path: artifacts/models/*.fp16.onnx
          compression-level: 0
          retention-days: 3

  windows:
    name: Build Windows x64
    needs: models
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64
          rustup target add x86_64-pc-windows-gnu
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: models
          path: artifacts/models
      - name: Build
        run: |
          uv sync --locked --no-install-project
          uv run --no-sync python tools/fetch_scanner_runtime.py
          uv run --no-sync python tools/build_windows.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-windows
          path: |
            dist/PortraitProcessor-Windows-x64.zip
            dist/PortraitProcessor-Windows-x64.zip.sha256
          compression-level: 0
          retention-days: 7

  windows-test:
    name: Test Windows x64
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-windows
      - name: Run self-test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PORTRAIT_SELFTEST_OUTPUT: ${{ runner.temp }}\self-test
        run: |
          Expand-Archive PortraitProcessor-Windows-x64.zip -DestinationPath .
          .\PortraitProcessor\runtime\python.exe .\PortraitProcessor\runtime\start_app.py --self-test
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$env:LOCALAPPDATA\PortraitProcessor\logs\app.log" -ErrorAction SilentlyContinue
            exit 1
          }

  unix:
    name: Build ${{ matrix.label }}
    needs: models
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-22.04
            artifact: package-linux
          - label: macOS arm64
            os: macos-latest
            artifact: package-macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: models
          path: artifacts/models
      - name: Build and self-test
        run: |
          uv sync --locked --no-install-project
          uv run --no-sync python tools/build_portable.py --self-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/PortraitProcessor-*.tar.gz
            dist/PortraitProcessor-*.zip
            dist/*.sha256
          compression-level: 0
          retention-days: 7

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-test, unix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Portrait Processor ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
