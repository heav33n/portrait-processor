[package]
name = "portrait-processor-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.27", features = ["auto-initialize"] }
numpy = "0.27"
rayon = "1.11"

[profile.release]
lto = "thin"
codegen-units = 1

